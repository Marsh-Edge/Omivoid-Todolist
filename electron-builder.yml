appId: com.omivoid.todolist
productName: Omivoid
copyright: Copyright © 2026 Omivoid

directories:
  output: release
  buildResources: build

# Only the static export and the compiled Electron shell are packaged.
# Production dependencies are not needed: the shell uses Node/Electron built-ins only.
files:
  - out/**/*
  - electron/out/**/*
  - package.json

asar: true
npmRebuild: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}.${ext}
