appId: com.omivoid.todolist
productName: Omivoid
copyright: Copyright © 2026 Omivoid

directories:
  output: release
  buildResources: build

# Only the static export and the compiled Electron shell are packaged.
# Production dependencies are not needed: the shell uses Node/Electron built-ins only.
files:
  - out/**/*
  - electron/out/**/*
  - electron/assets/**/*
  - package.json
  - "!**/node_modules/**/*"

asar: true
npmRebuild: false

# Electron fuse hardening for shipped builds: no ELECTRON_RUN_AS_NODE, no
# NODE_OPTIONS/--inspect injection, no loading code outside app.asar, and
# asar integrity validation (Windows ≥ electron 30). The file:// extra
# privileges fuse is off because the app never uses file://.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}.${ext}
