name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: jsdom 30 bundles an undici that calls
          # zlib.createZstdDecompress (added in Node 22.15), so the test
          # workers crash on Node 20.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (renderer)
        run: npm run typecheck

      - name: Typecheck (Electron shell)
        run: npm run electron:typecheck

      - name: Unit tests
        run: npm run test

  build:
    name: Static export & Electron shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Compile Electron shell
        run: npm run electron:compile

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: out/
          retention-days: 7
          if-no-files-found: error
